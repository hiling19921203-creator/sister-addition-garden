<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fff4e8">
<title>湊十加法樂園</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:18px 14px 30px;background:linear-gradient(150deg,#fff4e8,#fcecff 60%,#eaf8ff);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#493b54}main{max-width:620px;margin:auto}.top{text-align:center;padding:12px 5px 18px}.tag{display:inline-block;background:white;border-radius:30px;padding:8px 14px;color:#8a70b5;font-weight:800}.top h1{font-size:clamp(30px,8vw,43px);margin:12px 0 5px}.top p{margin:0;color:#887b91;font-weight:600}.stats{display:flex;gap:9px;margin-bottom:14px}.stat{flex:1;text-align:center;background:#ffffffdf;border:2px solid white;border-radius:17px;padding:10px 4px;box-shadow:0 5px 15px #6d587014}.stat b{display:block;font-size:21px}.stat small{font-size:12px;color:#93869a;font-weight:700}.progress{height:10px;background:#ffffffb8;border-radius:20px;overflow:hidden;margin:0 2px 18px}.bar{height:100%;width:0;background:linear-gradient(90deg,#ff9eb5,#b7a2e8);transition:width .3s}.card{background:white;border:3px solid white;border-radius:27px;padding:clamp(18px,5vw,28px);box-shadow:0 12px 30px #755c8b18;text-align:center}.round{display:inline-block;background:#fff1c9;color:#a77a25;border-radius:30px;padding:7px 14px;font-weight:800;font-size:14px}.prompt{font-size:18px;font-weight:800;margin:16px 0 8px}.equation{font-size:clamp(43px,12vw,62px);font-weight:900;margin:8px 0 16px;color:#59466c}.plus{color:#f49a67}.visual{display:flex;justify-content:center;align-items:center;gap:8px;flex-wrap:wrap;background:#fff8f1;border-radius:20px;padding:13px 8px;margin-bottom:15px}.group{min-width:78px}.group strong{display:block;font-size:12px;color:#9a8ba0;margin-bottom:7px}.dots{display:grid;grid-template-columns:repeat(5,13px);gap:5px;justify-content:center;min-height:31px}.dot{width:13px;height:13px;border-radius:50%}.op{font-size:25px;font-weight:900;color:#b19bcf}.carry{font-size:13px;color:#8c7b96;font-weight:700;margin:7px 0 0}.question{font-weight:800;margin:15px 0 10px}.answers{display:grid;grid-template-columns:repeat(2,1fr);gap:11px}.answer{border:2px solid #eee3f4;background:white;border-radius:18px;min-height:62px;font-size:27px;font-weight:900;color:#59466c;box-shadow:0 4px 0 #eee3f4;touch-action:manipulation}.answer.good{background:#e3f9ed;border-color:#80d6aa;color:#278354}.answer.bad{background:#fff0f1;border-color:#ffb4bd;color:#c65b6a}.feedback{min-height:52px;margin:14px 0 4px;font-weight:800;line-height:1.5}.goodtxt{color:#278354}.badtxt{color:#c16a70}.hint{border:0;background:#fff1c9;color:#946e26;border-radius:30px;padding:11px 18px;font-weight:800;margin:8px 5px}.next{border:0;background:linear-gradient(90deg,#ff91ad,#b69be8);color:white;border-radius:30px;padding:14px 28px;font-size:17px;font-weight:900;box-shadow:0 5px 0 #d6b6db;margin-top:10px}.next:disabled{opacity:.45}.hintbox{display:none;background:#f5efff;border-radius:16px;padding:12px;margin:10px 0;color:#705b91;font-weight:700;line-height:1.7}.finish{display:none}.bigstar{font-size:60px}.finish h2{font-size:30px}.finish p{line-height:1.7}.restart{background:#9bdcbe;color:#285b46;box-shadow:0 5px 0 #72c49c}.foot{text-align:center;color:#9b8fa1;font-size:12px;margin:16px}
</style></head>
<body><main>
<header class="top"><span class="tag">🌷 5 歲也能玩的數學遊戲</span><h1>🌈 湊十加法樂園</h1><p>動動腦、湊成十，星星帶回家！</p></header>
<section class="stats"><div class="stat"><b id="round">1 / 8</b><small>目前題數</small></div><div class="stat"><b>⭐ <span id="stars">0</span></b><small>得到星星</small></div><div class="stat"><b id="streak">0</b><small>連續答對</small></div></section>
<div class="progress"><div class="bar" id="bar"></div></div>
<section class="card" id="game"><span class="round" id="level">🌟 湊十小高手</span><div class="prompt">我們一起來算算看！</div>
<div class="equation"><span id="a"></span> <span class="plus">+</span> <span id="b"></span> = ?</div>
<div class="visual"><div class="group"><strong>第一個數的個位</strong><div class="dots" id="dotsA"></div></div><span class="op">＋</span><div class="group"><strong>第二個數的個位</strong><div class="dots" id="dotsB"></div></div></div>
<div class="carry" id="carry">先看個位數，試著湊成 10！</div><div class="question">選出正確答案 👇</div><div class="answers" id="answers"></div>
<div class="feedback" id="feedback">慢慢想，不用急喔！💗</div><div class="hintbox" id="hint"></div><button class="hint" id="hintBtn">💡 給我一點提示</button><div><button class="next" id="next" disabled>下一題 →</button></div></section>
<section class="card finish" id="finish"><div class="bigstar">🏆</div><h2>太棒了！闖關成功！</h2><p id="result"></p><div id="trophy" style="font-size:28px"></div><button class="next restart" id="restart">再玩一次！</button></section>
<div class="foot">每一次練習都會更進步喔！🌼</div></main>
<script>
const $=id=>document.getElementById(id),TOTAL=8;let qs=[],i=0,stars=0,streak=0,done=false;
function make(){qs=[];for(let k=0;k<TOTAL;k++){let a,b;do{a=12+Math.floor(Math.random()*28);b=12+Math.floor(Math.random()*18)}while(a%10+b%10<10||a+b>79);qs.push({a,b,sum:a+b})}}
function dots(el,n,color){el.innerHTML='';for(let j=0;j<n%10;j++){let d=document.createElement('i');d.className='dot';d.style.background=color;el.append(d)}}
function show(){done=false;let q=qs[i];$('round').textContent=(i+1)+' / '+TOTAL;$('stars').textContent=stars;$('streak').textContent=streak;$('bar').style.width=(i/TOTAL*100)+'%';$('a').textContent=q.a;$('b').textContent=q.b;$('level').textContent=i<3?'🌟 湊十小高手':i<6?'🚀 進位小達人':'👑 加法大挑戰';dots($('dotsA'),q.a,'#ffb4c5');dots($('dotsB'),q.b,'#8bd9b6');$('carry').textContent='個位數：'+q.a%10+' ＋ '+q.b%10+'，可以湊成 10 嗎？';$('feedback').className='feedback';$('feedback').textContent='慢慢想，不用急喔！💗';$('hint').style.display='none';$('hintBtn').style.display='inline-block';$('next').disabled=true;$('next').textContent=i===TOTAL-1?'看我的成績 🏆':'下一題 →';let choices=new Set([q.sum]);while(choices.size<4){let v=q.sum+(Math.random()<.5?-1:1)*(1+Math.floor(Math.random()*9));if(v>0&&v<100)choices.add(v)}$('answers').innerHTML='';[...choices].sort(()=>Math.random()-.5).forEach(v=>{let b=document.createElement('button');b.className='answer';b.textContent=v;b.onclick=()=>pick(v,b);$('answers').append(b)})}
function pick(v,btn){if(done)return;let q=qs[i];if(v===q.sum){done=true;stars++;streak++;$('stars').textContent=stars;$('streak').textContent=streak;$('feedback').className='feedback goodtxt';$('feedback').textContent='答對了！妳好棒！⭐';btn.classList.add('good');document.querySelectorAll('.answer').forEach(x=>x.disabled=true);$('next').disabled=false;$('hintBtn').style.display='none'}else{streak=0;$('streak').textContent=0;btn.classList.add('bad');btn.disabled=true;$('feedback').className='feedback badtxt';$('feedback').textContent='再想一下下！沒關係，我們再試試 💪'}}
$('hintBtn').onclick=()=>{let q=qs[i],x=q.a%10,y=q.b%10,s=x+y,c=Math.floor(s/10),t=Math.floor(q.a/10)+Math.floor(q.b/10)+c;$('hint').style.display='block';$('hint').innerHTML='💡 個位數：'+x+' ＋ '+y+' ＝ '+s+'。<br>個位寫 '+s%10+'，滿 10 就往十位進 1。<br>十位再算：'+Math.floor(q.a/10)+' ＋ '+Math.floor(q.b/10)+' ＋ '+c+' ＝ '+t+'。'};
$('next').onclick=()=>{if(i<TOTAL-1){i++;show()}else{$('game').style.display='none';$('finish').style.display='block';$('bar').style.width='100%';$('result').textContent='妳完成了 '+TOTAL+' 題，拿到 '+stars+' 顆星！每次願意練習都很值得鼓勵。';$('trophy').textContent='⭐'.repeat(stars)}};
$('restart').onclick=()=>{i=0;stars=0;streak=0;$('finish').style.display='none';$('game').style.display='block';make();show()};make();show();
</script></body></html>
