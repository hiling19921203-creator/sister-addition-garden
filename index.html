

<!DOCTYPE html>

<html lang="zh-Hant">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1">

<title>妹妹的加法小樂園</title>

<style>

body{margin:0;background:#fff4f7;font-family:Arial,"Noto Sans TC",sans-serif;text-align:center;color:#59434b;padding:20px}

main{max-width:500px;margin:auto}

h1{color:#e8799b}

.card{background:white;border-radius:24px;padding:24px;margin:18px 0;box-shadow:0 4px 15px #e9cbd5}

#question{font-size:48px;font-weight:bold;margin:18px}

#dots{font-size:28px;line-height:1.8;min-height:65px}

.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}

button{border:0;border-radius:16px;padding:16px;font-size:25px;background:#ffe0eb;color:#75485a;font-weight:bold}

button:active{transform:scale(.97)}

#message{font-size:22px;margin:18px;min-height:30px}

.small{font-size:16px;color:#967b85}

</style>

</head>

<body>

<main>

<h1>🌷 妹妹的加法小樂園 🌷</h1>

<p class="small">一起數一數，看看答案是多少！</p>

<div class="card">

<div class="small" id="progress">第 1 題 / 8 題</div>

<div id="question">3 + 2 = ?</div>

<div id="dots"></div>

<div class="answers" id="answers"></div>

<div id="message">加油！你一定可以！🌟</div>

<div class="small" id="score">⭐ 0 顆星</div>

</div>

<button onclick="next()" id="next" style="display:none;background:#b9e8c5">下一題 ➜</button>

</main>

<script>

const pairs=[[3,2],[2,3],[4,1],[4,4],[5,2],[6,3],[7,2],[8,1],[9,1],[9,2],[5,5],[6,6],[7,7],[8,8],[9,9]];

let list=[],index=0,score=0,answered=false;

function shuffle(a){return a.sort(()=>Math.random()-.5)}

function start(){list=shuffle([...pairs]).slice(0,8);index=0;score=0;show()}

function show(){

answered=false;

document.getElementById("next").style.display="none";

let [a,b]=list[index],sum=a+b;

document.getElementById("progress").textContent=`第 ${index+1} 題 / 8 題`;

document.getElementById("question").textContent=`${a} + ${b} = ?`;

document.getElementById("dots").textContent="🟡 ".repeat(a)+" ＋ "+"🟣 ".repeat(b);

document.getElementById("message").textContent="先數數看，再選答案喔！";

document.getElementById("score").textContent=`⭐ ${score} 顆星`;

let choices=shuffle([...new Set([sum,sum+1,Math.max(1,sum-1),sum+2])]);

document.getElementById("answers").innerHTML="";

choices.forEach(n=>{

let btn=document.createElement("button");btn.textContent=n;

btn.onclick=()=>pick(n,sum);document.getElementById("answers").appendChild(btn);

});

}

function pick(n,sum){

if(answered)return;

if(n===sum){

answered=true;score++;

document.getElementById("message").textContent="答對了！你好棒！🎉";

document.getElementById("score").textContent=`⭐ ${score} 顆星`;

document.getElementById("next").style.display="inline-block";

document.querySelectorAll(".answers button").forEach(b=>b.disabled=true);

}else{

document.getElementById("message").textContent="再數一次看看喔！💗";

}

}

function next(){

index++;

if(index>=8){

document.querySelector(".card").innerHTML=`<h1>🎉 太棒了！</h1><h2>完成 8 題了！</h2><p style="font-size:30px">⭐ ${score} 顆星</p><p>妹妹真棒！繼續加油！🌷</p>`;

document.getElementById("next").textContent="再玩一次";

document.getElementById("next").onclick=()=>location.reload();

}else show();

}

start();

</script>

</body>

</html>
